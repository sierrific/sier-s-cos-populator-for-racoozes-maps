name: Validate module

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install development dependencies
        # Release checks do not use the optional LevelDB discovery utilities.
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit

      - name: Validate module data
        run: npm run validate

      - name: Run core tests
        run: npm test

      - name: Build Foundry package
        run: npm run build

      - name: Audit release package
        run: npm run audit
