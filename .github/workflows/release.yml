name: Release module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install and audit development dependencies
        run: |
          npm ci --ignore-scripts
          npm audit

      - name: Validate module
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build Foundry package
        run: npm run build

      - name: Audit release package
        run: npm run audit

      - name: Verify tag and manifest version
        shell: bash
        run: |
          version="$(node -p "require('./racooze-cos-populator/module.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/module.json
            dist/racooze-cos-populator-*.zip
            dist/racooze-cos-populator-*.zip.sha256
            installer/install.ps1
            installer/install.sh
